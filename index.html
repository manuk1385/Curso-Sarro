<script>
/* =========================
   DATOS (SIEMPRE ARRIBA)
========================= */

let materiales = [
"01 - Introducción",
"02 - Diferencias",
"03 - Detección",
"04 - Componentes 1",
"05 - Componentes 2",
"06 - Componentes 3",
"07 - Componentes 4",
"08 - Componentes 5",
"09 - Componentes 6",
"10 - Tipos",
"11 - Fallas",

"12 - Final"
];

let videos = [
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/01-Introduccion.general.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/02-Diferencia.entre.calefon.tradicional.y.ionizado.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/03-Proceso.de.deteccion.de.llama.ionizada.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/04-Componentes-1.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/05-Componentes-2.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/06-Componentes-3.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/07-Componentes-4.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/08-Componentes-5.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/09-Componentes-6.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/10-Tipos.de.calefones.ionizados.y.como.funcionan.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/11-Fallas.y.mantenimiento.mp4",
"https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/13-Final.mp4"
];
    
let pdfs = [
"Pdf.pdf",                 
"Pdf1.pdf",
"Pdf2.pdf",
"Pdf3.pdf",
"Pdf4.pdf",
"Pdf5.pdf",
"Pdf6.pdf",
"Pdf7.pdf",
"Pdf8.pdf",
"Pdf9.pdf"
];

/* VIDEO NUEVO ORBIS EUROTREND */
const ORBIS_ID = "orbis_eurotrend";
const ORBIS_VIDEO_URL = "https://github.com/manuk1385/Curso-Sarro/releases/download/v2.0/videonuevo1.mp4";

/* =========================
   VARIABLES
========================= */

let usuarioActual = "";
let actual = 0;
let completados = [];

function obtenerDeviceID(){

let id = localStorage.getItem("device_id");

if(!id){

id = crypto.randomUUID();

localStorage.setItem("device_id", id);

}

return id;

}

/* =========================
   LOGIN
========================= */

async function login(){

let telefono = document.getElementById("user").value.trim();

let pass = document.getElementById("pass").value.trim();

if(telefono === ""){
alert("Ingresá tu teléfono");
return;
}

if(pass !== "CHIMANGOARCUCCI"){
alert("Contraseña incorrecta");
return;
}

const { data, error } = await supabaseClient
.from("usuarios")
.select("*")
.eq("telefono", telefono)
.maybeSingle();

if(error || !data){
alert("Usuario no encontrado");
return;
}

localStorage.setItem("usuarioActivo", telefono);

usuarioActual = telefono;

mostrarPanel();
}


/* =========================
   REGISTRO
========================= */

async function registrar(){

let telefono = document.getElementById("newUser").value.trim();

let pass = document.getElementById("newPass").value.trim();

if(telefono === "" || pass === ""){
alert("Completá los campos");
return;
}

/* CONTRASEÑA FIJA */

if(pass !== "CHIMANGOARCUCCI"){
alert("La contraseña es incorrecta");
return;
}

/* VERIFICA SI EXISTE */

const { data: existe } = await supabaseClient
.from("usuarios")
.select("*")
.eq("telefono", telefono)
.maybeSingle();

if(existe){
alert("Ese usuario ya existe");
return;
}

/* CREA USUARIO */

const token = crypto.randomUUID();

const { error } = await supabaseClient
.from("usuarios")
.insert([
{
telefono: telefono,
password: pass,
token: token,
activo: true,
device_id: null,
progreso:[]
}
]);

if(error){
console.log(error);
alert(JSON.stringify(error));
return;
}

const linkAcceso = "https://curso.sarrocero.com.ar/?token=" + token;

alert(
"Cuenta creada correctamente\n\n" +
"LINK DE ACCESO:\n" +
linkAcceso
);

mostrarLogin();

}

/* =========================
   VISTAS
========================= */

function mostrarRegistro(){
document.getElementById("login").style.display="none";
document.getElementById("registro").style.display="flex";
}

function mostrarLogin(){
document.getElementById("registro").style.display="none";
document.getElementById("login").style.display="flex";
}

/* =========================
   PANEL
========================= */

async function mostrarPanel(){


document.getElementById("login").style.display="none";
document.getElementById("registro").style.display="none";
document.getElementById("panel").style.display="block";

document.getElementById("usuario").innerText = usuarioActual;

await cargarProgreso();
cargarMaterial(0);
 
// carga primer video

}

/* =========================
   LOGOUT
========================= */

function logout(){
localStorage.removeItem("usuarioActivo");
location.reload();
}

/* =========================
   PROGRESO
========================= */

async function cargarProgreso(){

const { data } = await supabaseClient
.from("usuarios")
.select("progreso")
.eq("telefono", usuarioActual)
.maybeSingle();

completados = data?.progreso || [];

actualizarUI();

}

async function guardarProgreso(){

await supabaseClient
.from("usuarios")
.update({
progreso: completados
})
.eq("telefono", usuarioActual);

}

/* =========================
   CARGAR MATERIAL (VIDEO)
========================= */

function cargarMaterial(i){

actual = i;

document.getElementById("titulo").innerText = materiales[i];

document.getElementById("video").innerHTML = `
<video controls controlsList="nodownload" playsinline webkit-playsinline preload="metadata">
    <source src="${videos[i]}?raw=true" type="video/mp4">
</video>
`;

}

/* =========================
   ORBIS EUROTREND
========================= */

function mostrarOrbisEurotrend(){

actual = ORBIS_ID;

document.getElementById("listaMaterial").classList.remove("abierto");
document.getElementById("listaPDF").classList.remove("abierto");

document.getElementById("titulo").innerText = "🔥 Orbis Eurotrend";

document.getElementById("video").innerHTML = `
<video controls controlsList="nodownload" playsinline webkit-playsinline preload="metadata">
    <source src="${ORBIS_VIDEO_URL}" type="video/quicktime">
    Tu navegador no puede reproducir este video. Probá convertirlo a MP4 si no se ve.
</video>
`;

document.getElementById("texto").innerText = "Video especial Orbis Eurotrend.";

}

/* =========================
   BOTONES
========================= */

function siguiente(){
if(typeof actual === "number" && actual < materiales.length-1) cargarMaterial(actual+1);
}

function anterior(){
if(typeof actual === "number" && actual>0) cargarMaterial(actual-1);
}

/* =========================
   HECHO
========================= */

function hecho(){

let index = completados.indexOf(actual);

if(index===-1){
completados.push(actual);
}else{
completados.splice(index,1);
}

guardarProgreso();
actualizarUI();

}

/* =========================
   UI
========================= */

function actualizarUI(){

materiales.forEach((_,i)=>{
let c = document.getElementById("c"+i);
if(!c) return;

if(completados.includes(i)){
c.classList.add("completo");
}else{
c.classList.remove("completo");
}
});

/* círculo verde de Orbis Eurotrend */
let cOrbis = document.getElementById("c_orbis");
if(cOrbis){
    if(completados.includes(ORBIS_ID)){
        cOrbis.classList.add("completo");
    }else{
        cOrbis.classList.remove("completo");
    }
}

/* total = videos del curso + 1 video Orbis */
let totalContenido = materiales.length + 1;
let p = (completados.length / totalContenido) * 100;
document.getElementById("barra").style.width = p+"%";

}

/* =========================
   TOGGLES
========================= */

function toggleMenu(){
document.getElementById("listaMaterial").classList.toggle("abierto");
document.getElementById("listaPDF").classList.remove("abierto");
}

function togglePDF(){
document.getElementById("listaPDF").classList.toggle("abierto");
document.getElementById("listaMaterial").classList.remove("abierto");
}

async function accesoAutomatico(){

const params = new URLSearchParams(window.location.search);

const token = params.get("token");

if(!token) return;

const deviceID = obtenerDeviceID();

const { data } = await supabaseClient
.from("usuarios")
.select("*")
.eq("token", token)
.eq("activo", true)
.maybeSingle();

if(!data){

document.body.innerHTML = "Acceso inválido";

return;

}

/* PRIMER INGRESO */

if(!data.device_id){

await supabaseClient
.from("usuarios")
.update({
device_id: deviceID
})
.eq("token", token);

}

/* OTRO DISPOSITIVO */

else if(data.device_id !== deviceID){

document.body.innerHTML =
"Este acceso pertenece a otro dispositivo";

return;

}

usuarioActual = data.telefono;

mostrarPanel();

}
/* =========================
   INICIO (IMPORTANTE)
========================= */

document.addEventListener("DOMContentLoaded", () => {

let contenedor = document.getElementById("listaMaterial");
let contPDF = document.getElementById("listaPDF");

// MATERIAL
materiales.forEach((mat,i)=>{
    let div = document.createElement("div");
    div.className="item";
    div.onclick=()=>cargarMaterial(i);

    let circulo = document.createElement("div");
    circulo.className="circulo";
    circulo.id="c"+i;

    div.appendChild(circulo);
    div.append(mat);

    contenedor.appendChild(div);
});

// PDF
pdfs.forEach((pdf,i)=>{
    let div = document.createElement("div");
    div.className="item pdf-item";

    div.innerHTML = `📄 ${pdf.replace(".pdf","")}`;

    div.onclick = () => {
        window.open(pdfs[i], "_blank"); // abre en otra pestaña
