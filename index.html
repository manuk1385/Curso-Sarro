let telefono = document.getElementById("user").value.trim();

let pass = document.getElementById("pass").value.trim();

if(telefono === ""){
alert("Ingresá tu teléfono");
return;
}

if(pass !== "CHIMANGOARCUCCI"){
alert("Contraseña incorrecta");
return;
}

const { data, error } = await supabaseClient
.from("usuarios")
.select("*")
.eq("telefono", telefono)
.maybeSingle();

if(error || !data){
alert("Usuario no encontrado");
return;
}

localStorage.setItem("usuarioActivo", telefono);

usuarioActual = telefono;

mostrarPanel();
}


/* =========================
   REGISTRO
========================= */

async function registrar(){

let telefono = document.getElementById("newUser").value.trim();

let pass = document.getElementById("newPass").value.trim();

if(telefono === "" || pass === ""){
alert("Completá los campos");
return;
}

/* CONTRASEÑA FIJA */

if(pass !== "CHIMANGOARCUCCI"){
alert("La contraseña es incorrecta");
return;
}

/* VERIFICA SI EXISTE */

const { data: existe } = await supabaseClient
.from("usuarios")
.select("*")
.eq("telefono", telefono)
.maybeSingle();

if(existe){
alert("Ese usuario ya existe");
return;
}

/* CREA USUARIO */

const token = crypto.randomUUID();

const { error } = await supabaseClient
.from("usuarios")
.insert([
{
telefono: telefono,
password: pass,
token: token,
activo: true,
device_id: null,
progreso:[]
}
]);

if(error){
console.log(error);
alert(JSON.stringify(error));
return;
}

const linkAcceso = "https://curso.sarrocero.com.ar/?token=" + token;

alert(
"Cuenta creada correctamente\n\n" +
"LINK DE ACCESO:\n" +
linkAcceso
);

mostrarLogin();

}

/* =========================
   VISTAS
========================= */

function mostrarRegistro(){
document.getElementById("login").style.display="none";
document.getElementById("registro").style.display="flex";
}

function mostrarLogin(){
document.getElementById("registro").style.display="none";
document.getElementById("login").style.display="flex";
}

/* =========================

========================= */

async function mostrarPanel(){


document.getElementById("login").style.display="none";
document.getElementById("registro").style.display="none";
document.getElementById("panel").style.display="block";

document.getElementById("usuario").innerText = usuarioActual;

await cargarProgreso();
cargarMaterial(0);

/* =========================
   LOGOUT
========================= */

function logout(){
localStorage.removeItem("usuarioActivo");
location.reload();
}

/* =========================
   PROGRESO
========================= */

async function cargarProgreso(){

const { data } = await supabaseClient
.from("usuarios")
.select("progreso")
.eq("telefono", usuarioActual)
.maybeSingle();

completados = data?.progreso || [];

actualizarUI();

}

async function guardarProgreso(){

await supabaseClient
.from("usuarios")
.update({
progreso: completados
})
.eq("telefono", usuarioActual);

}

/* =========================
   CARGAR MATERIAL (VIDEO)
========================= */

function cargarMaterial(i){

document.getElementById("video").classList.remove("ia-mode");
const botones = document.querySelector(".botones");
if(botones) botones.style.display = "flex";
actual = i;

document.getElementById("titulo").innerText = materiales[i];

document.getElementById("video").innerHTML = `
<video controls controlsList="nodownload" playsinline webkit-playsinline preload="metadata">
    <source src="${videos[i]}?raw=true" type="video/mp4">
</video>
`;

}

/* =========================
   ORBIS EUROTREND
========================= */

function mostrarOrbisEurotrend(){

document.getElementById("video").classList.remove("ia-mode");
const botones = document.querySelector(".botones");
if(botones) botones.style.display = "flex";
actual = ORBIS_ID;

document.getElementById("listaMaterial").classList.remove("abierto");
document.getElementById("listaPDF").classList.remove("abierto");

document.getElementById("titulo").innerText = "🔥 Orbis Eurotrend";

document.getElementById("video").innerHTML = `
<video controls controlsList="nodownload" playsinline webkit-playsinline preload="metadata">
    <source src="${ORBIS_VIDEO_URL}" type="video/mp4">
    Tu navegador no puede reproducir este video. Probá convertirlo a MP4 si no se ve.
</video>
`;

document.getElementById("texto").innerText = "Video especial Orbis Eurotrend.";

}

/* =========================
   BOTONES
========================= */

function siguiente(){
if(typeof actual === "number" && actual < materiales.length-1) cargarMaterial(actual+1);
}

function anterior(){
if(typeof actual === "number" && actual>0) cargarMaterial(actual-1);
}

/* =========================
   HECHO
========================= */

function hecho(){

if(actual === null || actual === undefined){ alert("Este apartado no se marca como Hecho."); return; }
let index = completados.indexOf(actual);

if(index===-1){
completados.push(actual);
}else{
completados.splice(index,1);
}

guardarProgreso();
actualizarUI();

}

/* =========================
   UI
========================= */

function actualizarUI(){

materiales.forEach((_,i)=>{
let c = document.getElementById("c"+i);
if(!c) return;

if(completados.includes(i)){
c.classList.add("completo");
}else{
c.classList.remove("completo");
}
});

/* círculo verde de Orbis Eurotrend */
let cOrbis = document.getElementById("c_orbis");
if(cOrbis){
    if(completados.includes(ORBIS_ID)){
        cOrbis.classList.add("completo");
    }else{
        cOrbis.classList.remove("completo");
    }
}

/* total = videos del curso + 1 video Orbis */
let totalContenido = materiales.length + 1;
let p = (completados.length / totalContenido) * 100;
document.getElementById("barra").style.width = p+"%";

}

========================= */

document.getElementById("listaMaterial").classList.toggle("abierto");
document.getElementById("listaPDF").classList.remove("abierto");
}

function togglePDF(){
document.getElementById("listaPDF").classList.toggle("abierto");
document.getElementById("listaMaterial").classList.remove("abierto");
}

async function accesoAutomatico(){

const params = new URLSearchParams(window.location.search);

const token = params.get("token");

if(!token) return;

const deviceID = obtenerDeviceID();

const { data } = await supabaseClient
.from("usuarios")
.select("*")
.eq("token", token)
.eq("activo", true)
.maybeSingle();

if(!data){

document.body.innerHTML = "Acceso inválido";

return;

}

/* PRIMER INGRESO */

if(!data.device_id){

await supabaseClient
.from("usuarios")
.update({
device_id: deviceID
})
.eq("token", token);

}

/* OTRO DISPOSITIVO */

else if(data.device_id !== deviceID){

document.body.innerHTML =
"Este acceso pertenece a otro dispositivo";

return;

}

usuarioActual = data.telefono;

mostrarPanel();

}

<script id="iaAspeV13MicrofonoUnPermiso">
(function(){
  const SESSION_KEY = 'ia_aspe_mic_permiso_sesion_v13';
  const LANG = 'es-AR';

  window.IA_ASPE_RECOGNITION_V13 = window.IA_ASPE_RECOGNITION_V13 || null;
  window.IA_ASPE_LISTENING_V13 = false;
  window.IA_ASPE_BASE_TEXT_V13 = '';

  function estado(txt){
    const e = document.getElementById('iaMicEstado');
    if(e) e.innerText = txt;
  }

  function btn(){
    let b = document.getElementById('iaMicBtn') || document.querySelector('.ia-mic');
    if(!b) return null;
    b.id = 'iaMicBtn';
    b.onclick = window.iaMicrofono;
    return b;
  }

  function pintarMic(escuchando){
    const b = btn();
    if(!b) return;
    if(escuchando){
      b.classList.add('ia-listening');
      b.innerHTML = '<span class="ia-mic-dot" aria-hidden="true"></span>';
      b.title = 'Tocar para cortar';
      b.setAttribute('aria-label','Cortar micrófono');
    }else{
      b.classList.remove('ia-listening');
      b.innerHTML = '<span class="ia-mic-icon">🎙️</span>';
      b.title = 'Tocar para hablar';
      b.setAttribute('aria-label','Activar micrófono');
    }
  }

  function crearReconocimiento(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return null;

    const rec = new SR();
    rec.lang = LANG;
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = function(){
      window.IA_ASPE_LISTENING_V13 = true;
      sessionStorage.setItem(SESSION_KEY, '1');
      pintarMic(true);
      estado('Escuchando... tocá de nuevo el micrófono para cortar. No se envía solo.');
    };

    rec.onresult = function(ev){
      const input = document.getElementById('iaPregunta');
      if(!input) return;

      let finalTxt = '';
      let interimTxt = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const txt = ev.results[i][0].transcript || '';
        if(ev.results[i].isFinal) finalTxt += txt + ' ';
        else interimTxt += txt;
      }

      const base = window.IA_ASPE_BASE_TEXT_V13 || '';
      const nuevo = (base + ' ' + finalTxt + interimTxt).replace(/\s+/g,' ').trim();
      if(nuevo) input.value = nuevo;
      estado('Texto detectado. Podés corregirlo y después tocar Enviar.');
    };

    rec.onerror = function(ev){
      const error = ev && ev.error ? ev.error : '';
      window.IA_ASPE_LISTENING_V13 = false;
      pintarMic(false);

      if(error === 'not-allowed'){
        estado('Chrome no dejó usar el micrófono. En el cartel elegí “Permitir mientras visito el sitio”.');
      }else if(error === 'no-speech'){
        estado('No detecté palabras. Hablá más cerca del micrófono y probá de nuevo.');
      }else if(error === 'audio-capture'){
        estado('No encontré micrófono activo. Revisá el micrófono de Windows/Chrome.');
      }else{
        estado('La escucha se detuvo. Podés tocar el micrófono otra vez.');
      }
    };

    rec.onend = function(){
      window.IA_ASPE_LISTENING_V13 = false;
      pintarMic(false);
      estado('Escucha detenida. Podés editar el texto y tocar Enviar.');
    };

    return rec;
  }

  window.iaMicrofono = function(){
    const input = document.getElementById('iaPregunta');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SR){
      estado('Este navegador no tiene reconocimiento de voz. Usá Chrome actualizado.');
      return;
    }

    if(window.IA_ASPE_LISTENING_V13 && window.IA_ASPE_RECOGNITION_V13){
      try{ window.IA_ASPE_RECOGNITION_V13.stop(); }catch(e){}
      return;
    }

    window.IA_ASPE_BASE_TEXT_V13 = input ? input.value.trim() : '';

    /* IMPORTANTE:
       Antes se llamaba a getUserMedia() y después a SpeechRecognition.start().
       Eso podía generar DOS carteles de permiso.
       Ahora NO usamos getUserMedia: solo SpeechRecognition pide el micrófono una vez.
    */
    window.IA_ASPE_RECOGNITION_V13 = crearReconocimiento();
    if(!window.IA_ASPE_RECOGNITION_V13){
      estado('No se pudo iniciar el reconocimiento de voz.');
      return;
    }

    try{
      estado(sessionStorage.getItem(SESSION_KEY) ? 'Activando micrófono...' : 'Primer uso: aceptá el permiso del micrófono una sola vez.');
      window.IA_ASPE_RECOGNITION_V13.start();
    }catch(e){
      estado('El micrófono ya estaba iniciando. Esperá un segundo y tocá de nuevo.');
    }
  };

  const oldMostrarIA = window.mostrarIA;
  if(typeof oldMostrarIA === 'function'){
    window.mostrarIA = function(){
      oldMostrarIA.apply(this, arguments);
      setTimeout(function(){
        const b = btn();
        if(b){
          b.innerHTML = '<span class="ia-mic-icon">🎙️</span>';
          b.onclick = window.iaMicrofono;
        }
        const e = document.getElementById('iaMicEstado');
        if(e) e.innerText = 'Tocá el micrófono, aceptá el permiso una vez, hablá, volvé a tocar para cortar y después enviá.';
      }, 30);
    };
  }

  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(function(){ pintarMic(false); }, 100);
  });
})();
</script>

<script id="iaAspeV15SimpleFinal">
(function(){
  /* Evita que cada respuesta mande el chat abajo del todo. La respuesta queda agregada,
     pero el alumno puede bajar manualmente para leerla. */
  window.iaAgregar = function(html, tipo='bot'){
    const chat = document.getElementById('iaChat');
    if(!chat) return;
    const div = document.createElement('div');
    div.className = 'ia-bubble ' + (tipo === 'user' ? 'ia-user' : 'ia-bot');
    div.innerHTML = html;
    const estabaCercaDelFinal = (chat.scrollHeight - chat.scrollTop - chat.clientHeight) < 40;
    const topAntes = chat.scrollTop;
    chat.appendChild(div);
    /* Solo baja un poquito si el usuario ya estaba exactamente al final.
       En celular, si estaba leyendo arriba, no lo mueve. */
    if(estabaCercaDelFinal && window.innerWidth > 900){
      chat.scrollTop = chat.scrollHeight;
    }else{
      chat.scrollTop = topAntes;
    }
  };

  /* Reescribimos la solapa AI con SOLO 3 botones rápidos */
  window.mostrarAIAspe = function(){
    actual = null;
    const mat = document.getElementById('listaMaterial');
    const pdf = document.getElementById('listaPDF');
    if(mat) mat.classList.remove('abierto');
    if(pdf) pdf.classList.remove('abierto');
    const botones = document.querySelector('.botones');
    if(botones) botones.style.display = 'none';
    const videoBox = document.getElementById('video');
    videoBox.classList.add('ia-mode');
    document.getElementById('titulo').innerText = '🤖 AI Aspe';
    document.getElementById('texto').innerText = 'Asistente del curso para consultas sobre calefones ionizados.';
    videoBox.innerHTML = `
    <div class="ia-panel ia-panel-client">
      <div class="ia-card-head">
        <div class="ia-logo">AI</div>
        <div><h2>AI Aspe</h2><p>Escribí o hablá tu consulta. La AI usa el curso, imágenes y explicación ampliada.</p></div>
      </div>
      <div class="ia-quick ia-quick-client">
        <button onclick="iaPreguntaRapida('Mi calefón prende y se apaga')">Prende y se apaga</button>
        <button onclick="iaPreguntaRapida('Hace chispa pero no prende')">Hace chispa pero no prende</button>
        <button onclick="iaPreguntaRapida('No enciende')">No enciende</button>
      </div>
      <div id="iaChat" class="ia-chat-box">
        <div class="ia-bubble ia-bot"><b>AI Aspe:</b> Tocá el micrófono, hablá, volvé a tocarlo para cortar, revisá el texto y después tocá Enviar.</div>
      </div>
      <div class="ia-input-row">
        <button id="iaMicBtn" class="ia-mic" onclick="iaMicrofono()" title="Tocar para hablar"><span class="ia-mic-icon">🎙️</span></button>
        <textarea id="iaPregunta" placeholder="Ej: prende y se apaga, hace chispa pero no prende, no enciende, sensor de ionización, placa electrónica..."></textarea>
        <button class="ia-send" onclick="iaEnviar()">Enviar</button>
      </div>
      <div class="ia-actions-row ia-actions-row-simple">
        <button onclick="iaNuevaConversacion()">Nueva conversación</button>
      </div>
      <div id="iaMicEstado" class="ia-mic-state" style="display:none"></div>
    </div>`;

    setTimeout(function(){
      const b = document.getElementById('iaMicBtn');
      if(b){
        b.innerHTML = '<span class="ia-mic-icon">🎙️</span>';
        b.onclick = window.iaMicrofono;
      }
    },30);
  };

  /* Si el botón del sidebar llama mostrarIA, lo mandamos a la vista nueva */
  window.mostrarIA = window.mostrarAIAspe;

  /* Micrófono: sin cartel informativo fijo debajo. */
  const oldMicro = window.iaMicrofono;
  window.iaMicrofono = function(){
    const estado = document.getElementById('iaMicEstado');
    if(estado){
      estado.style.display = 'none';
      estado.innerText = '';
    }
    if(typeof oldMicro === 'function') return oldMicro.apply(this, arguments);
  };
})();
</script>

<style id="iaAspeV16NoAutoScroll">
  html, body, .content, .container, .ia-panel-client, .ia-chat-box{
    scroll-behavior:auto!important;
    overflow-anchor:none!important;
  }
</style>
<script id="iaAspeV16NoAutoScroll">
(function(){
  function guardarPosicion(){
    const chat = document.getElementById('iaChat');
    return {
      x: window.scrollX || window.pageXOffset || 0,
      y: window.scrollY || window.pageYOffset || 0,
      chat: chat,
      chatTop: chat ? chat.scrollTop : 0
    };
  }

  function restaurarPosicion(pos){
    if(!pos) return;
    if(pos.chat) pos.chat.scrollTop = pos.chatTop;
    window.scrollTo(pos.x, pos.y);
  }

  window.iaAgregar = function(html, tipo='bot'){
    const chat = document.getElementById('iaChat');
    if(!chat) return;

    const pos = guardarPosicion();

    const div = document.createElement('div');
    div.className = 'ia-bubble ' + (tipo === 'user' ? 'ia-user' : 'ia-bot');
    div.innerHTML = html;
    chat.appendChild(div);

    /* No bajar nunca automáticamente: queda en el mismo lugar donde hiciste la pregunta. */
    restaurarPosicion(pos);
    requestAnimationFrame(function(){ restaurarPosicion(pos); });
    setTimeout(function(){ restaurarPosicion(pos); }, 80);
    setTimeout(function(){ restaurarPosicion(pos); }, 300);
  };

  if(typeof window.iaEnviar === 'function'){
    const oldEnviar = window.iaEnviar;
    window.iaEnviar = async function(){
      const pos = guardarPosicion();
      const r = oldEnviar.apply(this, arguments);
      restaurarPosicion(pos);
      requestAnimationFrame(function(){ restaurarPosicion(pos); });
      setTimeout(function(){ restaurarPosicion(pos); }, 100);
      setTimeout(function(){ restaurarPosicion(pos); }, 500);
      return r;
    };
  }
})();
</script>
</body>
